---
name: Markdown fix
on:
  push:
    branches:
      - agent/add-markdown-lint-qa
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Normalize Markdown
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.md", "*.markdown"]
          ).decode().split("\0")
          for name in filter(None, paths):
              path = Path(name)
              if path.is_symlink():
                  continue
              lines = path.read_text().splitlines()

              frontmatter_end = -1
              has_frontmatter_title = False
              if lines and lines[0].strip() == "---":
                  for i in range(1, len(lines)):
                      if lines[i].strip() == "---":
                          frontmatter_end = i
                          has_frontmatter_title = any(
                              re.match(r"^title\s*:", line) for line in lines[1:i]
                          )
                          break
              if has_frontmatter_title:
                  in_fence = False
                  for i in range(frontmatter_end + 1, len(lines)):
                      stripped = lines[i].lstrip()
                      if stripped.startswith("```"):
                          in_fence = not in_fence
                          continue
                      if not in_fence and re.match(r"^#\s+", lines[i]):
                          lines[i] = "#" + lines[i]

              in_fence = False
              for i, line in enumerate(lines):
                  match = re.fullmatch(r"(\s*)```\s*", line)
                  if match:
                      if in_fence:
                          in_fence = False
                      else:
                          lines[i] = f"{match.group(1)}```text"
                          in_fence = True
                      continue
                  if re.match(r"^\s*```\S", line):
                      in_fence = True

              path.write_text("\n".join(lines) + "\n")

          report_path = Path("src/aims/reports.py")
          report_text = report_path.read_text()
          old = 'refs += f"[{numbers[key]}]"'
          new = 'refs += f"\\\\[{numbers[key]}\\\\]"'
          if old in report_text:
              report_path.write_text(report_text.replace(old, new))

          for name in (
              "tests/golden/2024-01-01-market-analysis-partially-gated.md",
              "tests/golden/2024-01-01-market-analysis-with-qualitative.md",
          ):
              path = Path(name)
              text = path.read_text()
              text = text.replace("[1][2]", r"\[1\]\[2\]")
              text = text.replace("[2][1]", r"\[2\]\[1\]")
              path.write_text(text)
          PY
          config_file="${RUNNER_TEMP}/markdownlint-cli2.jsonc"
          printf '{"config":{"MD013":false}}' > "${config_file}"
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2@0.23.2 --fix --config "${config_file}" --
          npx -y prettier@3.9.6 --write './**/*.{md,markdown,mdx}'
      - name: Commit Markdown fixes
        run: |
          if [[ -z "$(git status --porcelain -- '*.md' src/aims/reports.py)" ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.md' src/aims/reports.py
          git commit -m 'Fix Markdown lint issues'
          git push
