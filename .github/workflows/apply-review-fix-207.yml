---
name: Apply PR 207 review fix
on:
  push:
    branches:
      - agent/format-generated-markdown
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-generated-markdown
      - name: Apply review fix
        run: python3 .github/patch_review_207.py
      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aims/reports.py \
            .agents/skills/market-analysis/scripts/generate_report.py
          git commit -m "Move generated Markdown formatting into reports package"
          git push origin HEAD:agent/format-generated-markdown
