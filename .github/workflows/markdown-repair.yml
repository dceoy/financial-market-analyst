---
name: Markdown repair
on:
  push:
    branches:
      - agent/add-markdown-lint-qa
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Repair Markdown generators and canonical documents
        run: |
          python - <<'PY'
          from pathlib import Path

          reports = Path("src/aims/reports.py")
          text = reports.read_text()
          old = '''def _citation_refs(citations: list[Any], numbers: dict[str, int]) -> str:
              refs = ""
              for cid in citations:
                  key = str(cid)
                  if key not in numbers:
                      numbers[key] = len(numbers) + 1
                  refs += f"\\\\[{numbers[key]}\\\\]"
              return refs
          '''
          new = '''def _citation_refs(citations: list[Any], numbers: dict[str, int]) -> str:
              refs: list[str] = []
              for cid in citations:
                  key = str(cid)
                  if key not in numbers:
                      numbers[key] = len(numbers) + 1
                  refs.append(f"[{numbers[key]}]")
              return ", ".join(refs)
          '''
          if old not in text:
              raise SystemExit("citation helper pattern not found")
          reports.write_text(text.replace(old, new, 1))

          curation = Path("src/aims/okf_curation.py")
          text = curation.read_text()
          old = 'lines.extend(("```", concept_skeleton(cluster, generated_at), "```", ""))'
          new = 'lines.extend(("```text", concept_skeleton(cluster, generated_at), "```", ""))'
          if old not in text:
              raise SystemExit("curation fence pattern not found")
          curation.write_text(text.replace(old, new, 1))

          for name in (
              "tests/golden/2024-01-01-market-analysis-partially-gated.md",
              "tests/golden/2024-01-01-market-analysis-with-qualitative.md",
          ):
              path = Path(name)
              text = path.read_text()
              text = text.replace(r"\[1\]\[2\]", "[1], [2]")
              text = text.replace(r"\[2\]\[1\]", "[2], [1]")
              path.write_text(text)

          reserved = {
              Path("okf/index.md"): "# AIMS Knowledge Base",
              Path("okf/logs/log.md"): "# AIMS OKF Log",
          }
          for path, heading in reserved.items():
              text = path.read_text()
              marker = f"<!-- markdownlint-disable-next-line MD025 -->\n{heading}"
              if marker not in text:
                  if heading not in text:
                      raise SystemExit(f"heading not found: {path}")
                  text = text.replace(heading, marker, 1)
                  path.write_text(text)
          PY
          uv sync
          uv run python tools/okf_hugo_adapter.py --src okf --dst content/knowledge --clean
          config_file="${RUNNER_TEMP}/markdownlint-cli2.jsonc"
          printf '{"config":{"MD013":false}}' > "${config_file}"
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2@0.23.2 --fix --config "${config_file}" --
          npx -y prettier@3.9.6 --write './**/*.{md,markdown,mdx}'
          git ls-files -z -- '*.md' '*.markdown' \
            | xargs -0 -r npx -y markdownlint-cli2@0.23.2 --config "${config_file}" --
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.md' src/aims/reports.py src/aims/okf_curation.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Align generated Markdown with lint rules'
          git push
