---
name: Update event calendars
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      - name: Sync dependencies
        run: uv sync
      - name: Refresh earnings calendar
        run: |
          uv run python \
            .agents/skills/qualitative-analysis/scripts/update_calendars.py \
            --mapping data/mappings/canonical_instrument_mappings.csv \
            --output data/calendars/earnings.json
      - name: Validate calendars
        run: |
          for CAL in data/calendars/*.json; do
            uv run python \
              .agents/skills/qualitative-analysis/scripts/validate_calendar.py \
              --input "$CAL"
          done
      - name: Ignore metadata-only update
        run: |
          if git diff --quiet -I '"updated_at":' -- data/calendars/earnings.json; then
            git restore data/calendars/earnings.json
          fi
      - name: Set update metadata
        id: metadata
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "date_compact=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          add-paths: data/calendars/earnings.json
          branch: chore/refresh-calendars-${{ steps.metadata.outputs.date_compact }}
          base: main
          commit-message: "chore(data): refresh event calendars ${{ steps.metadata.outputs.date }}"
          title: "chore(data): refresh event calendars ${{ steps.metadata.outputs.date }}"
          body: Automated earnings-calendar refresh from yfinance. Macro events in data/calendars/macro_events.json are maintained by hand (see OPERATIONS.md).
          labels: agent:github-actions
