---
name: Patch generated Markdown formatting
on:
  push:
    branches:
      - agent/format-generated-markdown
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-generated-markdown
      - name: Patch generated Markdown flow
        run: python3 .github/patch_generated_markdown.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .agents/skills/market-analysis/scripts/generate_report.py \
            content/results/2026-08-13-market-analysis.md \
            .github/patch_generated_markdown.py
          git commit -m "Format generated Markdown before publishing"
          git push origin HEAD:agent/format-generated-markdown
