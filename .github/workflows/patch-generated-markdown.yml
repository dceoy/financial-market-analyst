---
name: Patch generated Markdown formatting
on:
  push:
    branches:
      - agent/format-generated-markdown
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-generated-markdown
      - name: Patch daily analysis workflow
        run: python3 .github/patch_generated_markdown.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          git commit -m "Format generated Markdown before publishing"
          git push origin HEAD:agent/format-generated-markdown
