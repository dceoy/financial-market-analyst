---
name: Clean up PR 173 review fix
on:
  pull_request:
    branches:
      - chatgpt/pr-173-fix-base
    types:
      - closed
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'chatgpt/pr-173-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Delete temporary branches
        run: |
          git push origin --delete chatgpt/pr-173-trigger
          git push origin --delete chatgpt/pr-173-fix-base
